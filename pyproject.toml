[project.urls]
Homepage = "https://github.com/metaist/LTS"
Documentation = "https://metaist.github.io/LTS/"
Repository = "https://github.com/metaist/LTS.git"
Changelog = "https://github.com/metaist/LTS/blob/main/CHANGELOG.md"

[project]
name = "LTS"
version = "0.1.0"
description = "Long-Term Stack: project templates and tooling preferences"
requires-python = ">=3.10"
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [{ name = "Metaist LLC", email = "metaist@metaist.com" }]

[dependency-groups]
dev = [
  # dev => latest
  "cogapp",
  "coverage",
  "ds-run",
  "mkdocs-material",
  "mypy",
  "pip", # for mypy
  "pyright",
  "pytest-cov",
  "pytest",
  "ruff",
  "ty",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "@overload"]
exclude_also = ["no cover: start(?s:.)*?no cover: stop"]

[tool.mypy]
disable_error_code = "unused-ignore"

[tool.pyright]
exclude = ["**/_vendor/**"]

[tool.ds.scripts]
# Build
setup = "uv sync"
clean = """
  rm -rf .mypy_cache;
  rm -rf .pytest_cache;
  rm -rf .ruff_cache;
  rm -rf dist;
  rm -rf htmlcov;
  rm -rf src/*.egg-info
  rm -rf .coverage;
"""

# Lint
lint = ["ruff-*", "+cspell"]
ruff-format = "uvx ruff format ${@:-.}"
ruff-lint = "uvx ruff check --fix ${@:-.}"
cspell = "npx --yes cspell lint --unique --gitignore --exclude '**/_vendor/**' '**/*.{py,txt,md,markdown}'"

# Type Check
types = ["ty", "pyrefly", "pyright", "mypy"]
ty = "uvx ty check --python-version ${PYTHON_VERSION:-3.10} src test"
pyrefly = "uvx pyrefly check --python-version ${PYTHON_VERSION:-3.10} src test"
pyright = "npx --yes pyright --pythonversion ${PYTHON_VERSION:-3.10} src test"
mypy = """
  mypy \
    --strict \
    --install-types \
    --non-interactive \
    --exclude '/_vendor/' \
    --exclude '/.venv/' \
    --python-version ${PYTHON_VERSION:-3.10} \
    src test
"""

# Test
test.help = "run unit tests"
test.shell = """
  coverage run --branch --source=src -m \
    pytest \
      --doctest-modules \
      $@ src test &&
  coverage report -m
"""

# Documentation
docs = ["cog", "mkdocs build"]
cog = "cog -r README.md docs/*.md"
docs-serve = "mkdocs serve"

# Common
dev.help = "lint, type-check, and unit tests"
dev.composite = ["lint", "types", "test"]
