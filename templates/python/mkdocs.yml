site_name: "{{NAME}}"
site_url: https://docs.metaist.com/{{NAME}}/
site_description: "{{DESCRIPTION}}"
site_author: Metaist LLC

repo_name: metaist/{{NAME}}
repo_url: https://github.com/metaist/{{NAME}}

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.suggest

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/metaist/{{NAME}}
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/{{NAME}}
